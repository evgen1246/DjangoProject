{% extends 'base.html' %}
{% load blog_tags %}

{% block title %}Удаление записи - Блог Skystore{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-exclamation-triangle-fill"></i> Удаление записи
                    </h3>
                </div>
                <div class="card-body">
                    <p class="lead">
                        <i class="bi bi-question-circle"></i> Вы уверены, что хотите удалить запись?
                    </p>
                    <div class="alert alert-warning">
                        <strong><i class="bi bi-file-text"></i> {{ object.title }}</strong>
                        <p class="mt-2 text-muted">{{ object.content|truncatechars:100 }}</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Подтвердить удаление
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
