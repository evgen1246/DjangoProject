{% extends 'base.html' %}
{% load blog_tags %}

{% block title %}Удаление записи - Блог Skystore{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Удаление записи</h3>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить запись?</p>
                    <div class="alert alert-warning">
                        <strong>{{ blog_post.title }}</strong>
                        <p class="mt-2 text-muted">{{ blog_post.content|truncatechars:100 }}</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog:blogpost_detail' blog_post.pk %}" class="btn btn-secondary">
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                🗑️ Подтвердить удаление
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
