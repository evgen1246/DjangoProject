{% extends 'base.html' %}

{% block title %}Удаление товара - Skystore{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Удаление товара</h3>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить товар?</p>

                    <div class="alert alert-warning">
                        <strong>{{ product.name }}</strong>
                        <p class="mt-2 text-muted">{{ product.description|truncatechars:100 }}</p>
                        <p><span class="badge bg-secondary">{{ product.category.name }}</span></p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
